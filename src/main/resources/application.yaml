server:
  port: 5051

spring:
  application:
    name: cloud-gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:5052
          predicates:
            - Path=/auth/**

        - id: tenant-user-service
          uri: http://localhost:5053
          predicates:
            - Path=/tenants/**

        - id: document-service
          uri: http://localhost:5054
          predicates:
            - Path=/documents/**

        - id: vector-service
          uri: http://localhost:5055
          predicates:
            - Path=/vectors/**

        - id: ai-transformation-service
          uri: http://localhost:5056
          predicates:
            - Path=/ai/**

        - id: transaction-service
          uri: http://localhost:5057
          predicates:
            - Path=/transaction/**
           

auth:
  service:
    url: http://localhost:5052             

jwt:
